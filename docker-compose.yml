name: ${COMPOSE_PROJECT_NAME:-flagforge}

# The Flagsmith services below follow the official v2.295.2 deployment file:
# https://github.com/Flagsmith/flagsmith/blob/v2.295.2/docker-compose.yml
# The image is pinned by release and digest. Flagsmith uses its own PostgreSQL
# volume; it does not share FlagForge's database or Redis.
x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:${FLAGSMITH_POSTGRES_PASSWORD:?Run setup.ps1 to create local secrets}@flagsmith-postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: "true"
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: "*"
  FLAGSMITH_DOMAIN: ${FLAGSMITH_DOMAIN:-localhost:8081}
  DJANGO_SECRET_KEY: ${FLAGSMITH_DJANGO_SECRET_KEY:?Run setup.ps1 to create local secrets}
  WAREHOUSE_CREDENTIALS_SECRET: ${FLAGSMITH_WAREHOUSE_CREDENTIALS_SECRET:?Run setup.ps1 to create local secrets}
  TASK_RUN_METHOD: TASK_PROCESSOR
  # A single web worker keeps the full development stack within small local
  # Docker memory budgets. Override for larger hosts; upstream supports this.
  GUNICORN_WORKERS: ${FLAGSMITH_GUNICORN_WORKERS:-1}
  PROMETHEUS_ENABLED: "true"
  EXPERIMENTATION_ENABLED: "true"
  ENABLE_TASK_PROCESSOR_HEALTH_CHECK: "true"
  # Flagsmith 2.295.2 resolves callback hostnames and rejects private IPs by default.
  # Trust only this Compose service DNS name for this local FlagForge webhook receiver.
  # The SSRF guard remains enabled for all other destinations.
  SSRF_ALLOWED_HOSTS: api.flagforge.local

x-flagforge-env: &flagforge-env
  APP_ENV: ${APP_ENV:-development}
  SECRET_KEY: ${APP_SECRET_KEY:?Run setup.ps1 to create local secrets}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run setup.ps1 to create local secrets}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flagforge}:${POSTGRES_PASSWORD:?Run setup.ps1 to create local secrets}@postgres:5432/${POSTGRES_DB:-flagforge}
  REDIS_URL: redis://redis:6379/0
  FLAGSMITH_BASE_URL: ${FLAGSMITH_BASE_URL:-http://flagsmith:8000/api/v1}
  FLAGSMITH_ALLOWED_HOSTS: '${FLAGSMITH_ALLOWED_HOSTS:-["flagsmith"]}'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_INGEST_TOKEN: ${OTEL_INGEST_TOKEN:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - flagforge-net

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: *flagforge-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flagforge-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment: *flagforge-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      flagsmith:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      flagforge-net:
        aliases:
          - api.flagforge.local

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *flagforge-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; c=redis.Redis.from_url(os.environ['REDIS_URL']); assert c.ping() and c.exists('flagforge:worker:heartbeat'); print('worker ready')"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - flagforge-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flagforge}
      POSTGRES_USER: ${POSTGRES_USER:-flagforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 to create local secrets}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - flagforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagforge} -d ${POSTGRES_DB:-flagforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flagforge-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - flagforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flagforge-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    restart: unless-stopped
    environment:
      OTEL_INGEST_TOKEN: ${OTEL_INGEST_TOKEN:-}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - flagforge-net

  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEMO_APP_PORT:-8080}:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      FLAGSMITH_BASE_URL: http://flagsmith:8000/api/v1
      FLAGSMITH_ENVIRONMENT_KEY: ${FLAGSMITH_ENVIRONMENT_KEY:-}
      FLAGFORGE_ORGANIZATION_ID: ${FLAGFORGE_TELEMETRY_ORGANIZATION_ID:-}
      FLAGFORGE_PROJECT_ID: ${FLAGFORGE_TELEMETRY_PROJECT_ID:-}
      FLAGFORGE_ENVIRONMENT_NAME: ${FLAGFORGE_TELEMETRY_ENVIRONMENT:-staging}
    depends_on:
      api:
        condition: service_healthy
      flagsmith:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flagforge-net

  flagsmith-postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FLAGSMITH_POSTGRES_PASSWORD:?Run setup.ps1 to create local secrets}
    volumes:
      - flagsmith_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d flagsmith -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - flagforge-net

  flagsmith-migrate-db:
    image: ${FLAGSMITH_IMAGE:-docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35}
    command: ["migrate"]
    environment: *flagsmith-env
    depends_on:
      flagsmith-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - flagforge-net

  flagsmith:
    image: ${FLAGSMITH_IMAGE:-docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35}
    command: ["serve"]
    restart: unless-stopped
    environment: *flagsmith-env
    ports:
      - "127.0.0.1:${FLAGSMITH_PORT:-8081}:8000"
    depends_on:
      flagsmith-migrate-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - flagforge-net

  flagsmith-task-processor:
    image: ${FLAGSMITH_IMAGE:-docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35}
    command: ["run-task-processor"]
    restart: unless-stopped
    environment: *flagsmith-env
    depends_on:
      flagsmith-migrate-db:
        condition: service_completed_successfully
      flagsmith:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - flagforge-net

volumes:
  flagforge_postgres_data:
  flagforge_redis_data:
  flagsmith_postgres_data:

networks:
  flagforge-net:
    driver: bridge
