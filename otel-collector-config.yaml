receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: flagforge
  otlphttp/flagforge:
    endpoint: http://api:8000/api/v1/telemetry/otlp
    encoding: json
    compression: none
    headers:
      Authorization: "Bearer ${env:OTEL_INGEST_TOKEN}"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus, otlphttp/flagforge]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
